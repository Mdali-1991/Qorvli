{# Shown when an unexpected server error occurs. #}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | QORVLI</title>
    <!-- Google Fonts (Poppins): https://fonts.google.com/ -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3.3 & Bootstrap Icons via jsDelivr CDN: https://getbootstrap.com/ -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="qorvli-error-body">
    <main class="qorvli-error-card">
        <i class="bi bi-exclamation-octagon-fill qorvli-error-icon qorvli-error-icon-danger" aria-hidden="true"></i>
        <h1 class="qorvli-error-code">500</h1>
        <h2>Something broke behind the scenes.</h2>
        <p>An unexpected error occurred. Please try again in a moment.</p>
        <a href="/" class="btn qorvli-btn-primary btn-lg mt-3"><i class="bi bi-house-door-fill" aria-hidden="true"></i> Back to Feed</a>
    </main>
</body>
</html>

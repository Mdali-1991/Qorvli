<svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="900" fill="#ffffff"/>
  <text x="40" y="30" font-size="12" fill="#9aa0ab" letter-spacing="1">WIREFRAME — 04</text>
  <text x="760" y="30" font-size="12" fill="#9aa0ab" letter-spacing="1">MOBILE / FEED</text>

  <!-- phone frame -->
  <rect x="290" y="60" width="320" height="700" rx="30" fill="#ffffff" stroke="#2b2f38" stroke-width="3"/>
  <rect x="310" y="80" width="280" height="660" rx="4" fill="#ffffff"/>

  <!-- navbar collapsed -->
  <rect x="310" y="80" width="280" height="54" fill="#ffffff" stroke="#d7dae0"/>
  <rect x="326" y="98" width="18" height="18" rx="4" fill="#c7cad2"/>
  <text x="352" y="112" font-size="13" font-weight="bold" fill="#2b2f38">QORVLI</text>
  <!-- hamburger -->
  <g stroke="#4a4f59" stroke-width="2">
    <line x1="548" y1="100" x2="572" y2="100"/>
    <line x1="548" y1="107" x2="572" y2="107"/>
    <line x1="548" y1="114" x2="572" y2="114"/>
  </g>

  <!-- composer -->
  <rect x="322" y="146" width="256" height="70" rx="8" fill="#ffffff" stroke="#d7dae0"/>
  <circle cx="342" cy="168" r="11" fill="#e5e6ea" stroke="#c7cad2"/>
  <rect x="360" y="160" width="200" height="18" rx="5" fill="#f6f7f9" stroke="#e4e6ea"/>
  <rect x="480" y="192" width="80" height="18" rx="9" fill="#2b2f38"/>
  <text x="498" y="205" font-size="9" fill="#ffffff">Post</text>

  <!-- post card 1 -->
  <rect x="322" y="228" width="256" height="230" rx="8" fill="#ffffff" stroke="#d7dae0"/>
  <circle cx="342" cy="250" r="11" fill="#e5e6ea" stroke="#c7cad2"/>
  <rect x="360" y="243" width="100" height="8" rx="2" fill="#3a3f49"/>
  <rect x="360" y="255" width="70" height="7" rx="2" fill="#c7cad2"/>
  <rect x="332" y="272" width="236" height="8" rx="2" fill="#c7cad2"/>
  <rect x="332" y="286" width="180" height="8" rx="2" fill="#c7cad2"/>
  <rect x="332" y="302" width="236" height="110" rx="6" fill="#f1f2f5" stroke="#d7dae0"/>
  <line x1="332" y1="302" x2="568" y2="412" stroke="#d7dae0"/>
  <line x1="568" y1="302" x2="332" y2="412" stroke="#d7dae0"/>
  <text x="450" y="360" font-size="9" fill="#9aa0ab" text-anchor="middle">IMAGE</text>
  <text x="332" y="436" font-size="10" fill="#4a4f59">♥ 14      💬 2</text>

  <!-- post card 2 -->
  <rect x="322" y="470" width="256" height="140" rx="8" fill="#ffffff" stroke="#d7dae0"/>
  <circle cx="342" cy="492" r="11" fill="#e5e6ea" stroke="#c7cad2"/>
  <rect x="360" y="485" width="100" height="8" rx="2" fill="#3a3f49"/>
  <rect x="360" y="497" width="70" height="7" rx="2" fill="#c7cad2"/>
  <rect x="332" y="514" width="236" height="8" rx="2" fill="#c7cad2"/>
  <rect x="332" y="528" width="200" height="8" rx="2" fill="#c7cad2"/>
  <rect x="332" y="528" width="0" height="0"/>
  <text x="332" y="580" font-size="10" fill="#4a4f59">♡ 3      💬 0</text>

  <!-- pagination -->
  <rect x="380" y="630" width="160" height="26" rx="13" fill="#ffffff" stroke="#c7cad2"/>
  <text x="440" y="648" font-size="9" fill="#4a4f59">‹  Page 1 / 4  ›</text>

  <!-- home indicator -->
  <rect x="420" y="722" width="80" height="4" rx="2" fill="#c7cad2"/>

  <!-- callouts -->
  <g font-size="12" fill="#8b6bd1">
    <text x="40" y="120">① Search bar + username move</text>
    <text x="58" y="136">   into the hamburger menu below</text>
    <text x="58" y="152">   the ~992px breakpoint</text>

    <text x="40" y="200">② Sidebar ("Suggested for you")</text>
    <text x="58" y="216">   is hidden on mobile, shown only</text>
    <text x="58" y="232">   ≥ 992px, to keep the feed focused</text>

    <text x="40" y="320">③ Post cards stack full-width;</text>
    <text x="58" y="336">   image placeholders scale down</text>
    <text x="58" y="352">   with max-width: 100%</text>

    <text x="40" y="440">④ Like / comment tap targets</text>
    <text x="58" y="456">   stay ≥ 44px for touch accessibility</text>

    <text x="660" y="640">⑤ Pagination controls remain</text>
    <text x="678" y="656">   centered and reachable by thumb</text>
  </g>
</svg>

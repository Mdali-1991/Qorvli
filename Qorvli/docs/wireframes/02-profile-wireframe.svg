<svg viewBox="0 0 1280 900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1280" height="900" fill="#ffffff"/>

  <text x="40" y="30" font-size="12" fill="#9aa0ab" letter-spacing="1">WIREFRAME — 02</text>
  <text x="1110" y="30" font-size="12" fill="#9aa0ab" letter-spacing="1">USER PROFILE</text>

  <!-- Navbar -->
  <rect x="0" y="48" width="1280" height="64" fill="#ffffff" stroke="#d7dae0"/>
  <rect x="40" y="68" width="24" height="24" rx="6" fill="#c7cad2"/>
  <text x="74" y="86" font-size="17" font-weight="bold" fill="#2b2f38">QORVLI</text>
  <text x="1030" y="72" font-size="11" fill="#6b7280">FEED</text>
  <circle cx="1090" cy="80" r="13" fill="#e5e6ea" stroke="#c7cad2"/>
  <rect x="1150" y="67" width="90" height="26" rx="13" fill="#ffffff" stroke="#c7cad2"/>
  <text x="1168" y="84" font-size="11" fill="#4a4f59">Logout</text>

  <!-- Banner -->
  <rect x="0" y="112" width="1280" height="180" fill="#eef0f2"/>
  <line x1="0" y1="112" x2="1280" y2="292" stroke="#dfe2e6"/>
  <line x1="1280" y1="112" x2="0" y2="292" stroke="#dfe2e6"/>
  <text x="640" y="205" font-size="11" fill="#9aa0ab" text-anchor="middle">COVER / BANNER AREA</text>

  <!-- Avatar overlapping banner -->
  <circle cx="140" cy="292" r="64" fill="#ffffff" stroke="#d7dae0" stroke-width="3"/>
  <circle cx="140" cy="292" r="56" fill="#e5e6ea" stroke="#c7cad2"/>

  <!-- Profile info -->
  <rect x="230" y="320" width="240" height="18" rx="4" fill="#2b2f38"/>
  <rect x="230" y="346" width="140" height="12" rx="3" fill="#9aa0ab"/>
  <rect x="230" y="368" width="360" height="10" rx="3" fill="#c7cad2"/>
  <text x="230" y="400" font-size="11" fill="#6b7280">📍 Location   ·   📅 Joined Month Year   ·   ▦ 42 posts</text>

  <!-- Edit profile button (own profile only) -->
  <rect x="1080" y="330" width="160" height="34" rx="17" fill="#ffffff" stroke="#c7cad2"/>
  <text x="1108" y="352" font-size="12" fill="#4a4f59">✎ Edit Profile</text>
  <text x="1080" y="384" font-size="10" fill="#8b6bd1">only visible on own profile</text>

  <!-- divider -->
  <line x1="40" y1="428" x2="1240" y2="428" stroke="#eef0f2"/>
  <text x="40" y="450" font-size="12" fill="#6b7280" letter-spacing="0.5">POSTS BY THIS USER</text>

  <!-- Post card A -->
  <rect x="40" y="470" width="580" height="190" rx="10" fill="#ffffff" stroke="#d7dae0"/>
  <circle cx="70" cy="500" r="14" fill="#e5e6ea" stroke="#c7cad2"/>
  <rect x="94" y="492" width="120" height="10" rx="3" fill="#3a3f49"/>
  <rect x="94" y="508" width="90" height="8" rx="3" fill="#c7cad2"/>
  <rect x="60" y="528" width="500" height="10" rx="3" fill="#c7cad2"/>
  <rect x="60" y="544" width="360" height="10" rx="3" fill="#c7cad2"/>
  <rect x="60" y="566" width="540" height="60" rx="8" fill="#f1f2f5" stroke="#d7dae0"/>
  <line x1="60" y1="566" x2="600" y2="626" stroke="#d7dae0"/>
  <line x1="600" y1="566" x2="60" y2="626" stroke="#d7dae0"/>
  <text x="330" y="600" font-size="10" fill="#9aa0ab" text-anchor="middle">IMAGE</text>
  <text x="60" y="646" font-size="11" fill="#4a4f59">♡ 12   💬 3 comments</text>

  <!-- Post card B -->
  <rect x="660" y="470" width="580" height="190" rx="10" fill="#ffffff" stroke="#d7dae0"/>
  <circle cx="690" cy="500" r="14" fill="#e5e6ea" stroke="#c7cad2"/>
  <rect x="714" y="492" width="120" height="10" rx="3" fill="#3a3f49"/>
  <rect x="714" y="508" width="90" height="8" rx="3" fill="#c7cad2"/>
  <rect x="680" y="528" width="520" height="10" rx="3" fill="#c7cad2"/>
  <rect x="680" y="544" width="440" height="10" rx="3" fill="#c7cad2"/>
  <rect x="680" y="544" width="0" height="0"/>
  <text x="680" y="600" font-size="11" fill="#c7cad2">(text-only post — no image attached)</text>
  <text x="680" y="646" font-size="11" fill="#4a4f59">♥ 8 (liked)   💬 1 comment</text>

  <!-- Empty state note -->
  <rect x="40" y="690" width="1200" height="70" rx="10" fill="#fbfbfc" stroke="#eef0f2" stroke-dasharray="4 4"/>
  <text x="640" y="730" font-size="11" fill="#9aa0ab" text-anchor="middle">If this user has no posts yet: empty-state illustration + "No posts yet." message</text>

  <!-- Annotations -->
  <g font-size="11" fill="#8b6bd1">
    <text x="40" y="800">① Clicking a username/avatar anywhere in the app routes here</text>
    <text x="40" y="818">② Bio, location and joined-date are optional fields — hidden when empty</text>
    <text x="40" y="836">③ Like state reflects the current viewer, not the profile owner</text>
  </g>
</svg>
